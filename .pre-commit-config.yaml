repos:
  # Before the formatters, so they check its output. Needs `hugo` on the PATH.
  - repo: local
    hooks:
      - id: highlight-styles
        name: generate assets/chroma.css
        entry: python scripts/highlight_styles.py
        language: python
        additional_dependencies: [tinycss2>=1.4]
        files: ^(config\.toml|netlify\.toml|scripts/highlight_styles\.py|assets/chroma\.css)$
        pass_filenames: false
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.10
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier
          - prettier-plugin-go-template
  # Biome formats and lints what has no Go templates (see biome.jsonc and .prettierignore)
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.6.7
    hooks:
      - id: biome-check
        files: "" # the hook’s default omits .scss; biome.jsonc’s `files.includes` decides
  - repo: local
    hooks:
      # js.Build only strips the types, so nothing else would catch a type error.
      - id: tsc
        name: typecheck
        entry: tsc --noEmit
        language: node
        additional_dependencies: [typescript@7]
        files: \.ts$|^tsconfig\.json$
        pass_filenames: false
      # Colors come from Bootstrap’s tokens or the brand variables in main.scss, so both modes work.
      - id: stylelint
        name: stylelint
        entry: stylelint
        language: node
        additional_dependencies: [stylelint@16, postcss-scss@4]
        files: \.scss$
  - repo: https://github.com/ericmjl/webp-pre-commit
    rev: v0.0.12
    hooks:
      # img/logo is excluded on purpose: the media kit advertises PNG downloads.
      - id: convert-to-webp
        files: ^static/img/(blog|learn|events)/.*\.(png|jpe?g|gif|bmp|tiff)$
  - repo: https://github.com/oxipng/oxipng
    rev: v10.2.1
    hooks:
      - id: oxipng
        args: [--strip, safe]
