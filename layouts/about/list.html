{{ define "main" }}
  <div class="with-toc with-toc--prose">
    {{ partial "toc.html" . }}
    <div class="with-toc-body">
      <h1>{{ .Title }}</h1>
      <article class="post">
        <div id="about-content">
          {{ .Content }}
        </div>
      </article>
    </div>
  </div>
{{ end }}
