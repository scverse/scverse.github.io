{{ define "main" }}
  <with-toc class="with-toc--prose">
    {{ partial "toc.html" . }}
    <div class="with-toc-body">
      <h1>{{ .Title }}</h1>
      <article class="post">
        <div class="about-content">
          {{ .Content }}
        </div>
      </article>
    </div>
  </with-toc>
{{ end }}
