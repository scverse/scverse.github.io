<div class="container" style="max-width: 1200px;" data-pagefind-ignore>
  <nav class="navbar md:navbar-expand">
    <div class="container-fluid" style="padding: 0;">
      <a class="navbar-brand" href="/">
        <div id="scverse-logo"></div>
        <span class="visually-hidden">scverse</span>
        <!--{{ if ne .Section `` }}
          <span class="logo-name col m-0 px-3">scverse</span>
        {{ end }}-->
      </a>
      <button
        class="btn-icon navbar-toggler"
        type="button"
        data-bs-toggle="drawer"
        data-bs-target="#navbar-drawer"
        aria-controls="navbar-drawer"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
      </button>
      <dialog class="drawer drawer-end" id="navbar-drawer" aria-label="Site navigation">
        <div class="drawer-header">
          <button type="button" class="btn-close ms-auto" data-bs-dismiss="drawer" aria-label="Close"></button>
        </div>
        <div class="drawer-body">
          <ul class="navbar-nav nav-buttons">
            <li class="nav-item">
              <a
                class="nav-link{{ if eq .Section `packages` }}
                  active
                {{ end }}"
                href="/packages"
                id="packages-menu"
                role="button"
                data-bs-toggle="menu"
                aria-expanded="false"
              >
                Packages <i class="bi bi-caret-down-fill nav-caret" aria-hidden="true"></i>
              </a>
              <div class="menu" aria-labelledby="packages-menu">
                <a class="menu-item" href="/packages#core-packages">Core</a>
                <a class="menu-item" href="/packages/#ecosystem">Ecosystem</a>
              </div>
            </li>
            <li class="nav-item">
              <a
                class="nav-link{{ if eq .Section `learn` }}
                  active
                {{ end }}"
                href="/learn"
                >Learn</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link{{ if eq .Section `people` }}
                  active
                {{ end }}"
                href="/people"
                >People</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link{{ if eq .Section `blog` }}
                  active
                {{ end }}"
                href="/blog"
                >Blog</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link{{ if or (eq .Section `events`) (eq .Section `community-calendar`) }}
                  active
                {{ end }}"
                href="/events"
                id="events-menu"
                role="button"
                data-bs-toggle="menu"
                aria-expanded="false"
              >
                Events <i class="bi bi-caret-down-fill nav-caret" aria-hidden="true"></i>
              </a>
              <div class="menu" aria-labelledby="events-menu">
                <a class="menu-item" href="/events">Events</a>
                <a class="menu-item" href="/community-calendar">Community Calendar</a>
              </div>
            </li>
            <li class="nav-item">
              <a
                class="nav-link{{ if eq .Section `conference2026` }}
                  active
                {{ end }}"
                href="/conference2026"
                >Conference</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link{{ if eq .Section `about` }}
                  active
                {{ end }}"
                href="/about"
                id="about-menu"
                role="button"
                data-bs-toggle="menu"
                aria-expanded="false"
              >
                About <i class="bi bi-caret-down-fill nav-caret" aria-hidden="true"></i>
              </a>
              <div class="menu" aria-labelledby="about-menu">
                <a class="menu-item" href="/about">About scverse</a>
                <a class="menu-item" href="/about/mission">Mission statement</a>
                <a class="menu-item" href="/about/roles">Roles</a>
                <a class="menu-item" href="/about/code_of_conduct">Code of Conduct</a>
                <a class="menu-item" href="/about/ai_policy">AI Policy</a>
                <a class="menu-item" href="/stats">Statistics</a>
                <a class="menu-item" href="/design">Media kit</a>
                <!-- This is just a second link to the /join page, but makes it more discoverable for people who think “I don’t want to join, just contact” -->
                <a class="menu-item" href="/join">Contact</a>
              </div>
            </li>
            <li class="nav-item nav-social">
              <a href="https://github.com/scverse" target="_blank" rel="noopener" aria-label="scverse on GitHub">
                <i class="bi bi-github" aria-hidden="true"></i>
              </a>
              <a href="https://discourse.scverse.org" target="_blank" rel="noopener" aria-label="scverse on Discourse">
                <i class="i-discourse" aria-hidden="true"></i>
              </a>
              <a href="https://scverse.zulipchat.com" target="_blank" rel="noopener" aria-label="scverse on Zulip">
                <i class="i-zulip" aria-hidden="true"></i>
              </a>
              <a
                href="https://bsky.app/profile/scverse.bsky.social"
                target="_blank"
                rel="noopener"
                aria-label="scverse on Bluesky"
              >
                <i class="i-bluesky" aria-hidden="true"></i>
              </a>
              <a
                href="https://www.youtube.com/channel/UCpsvsIAW3R5OdftJKKuLNMA"
                target="_blank"
                rel="noopener"
                aria-label="scverse on YouTube"
              >
                <i class="bi bi-youtube" aria-hidden="true"></i>
              </a>
            </li>
            <li class="nav-item">
              <button
                type="button"
                command="show-modal"
                commandfor="search-dialog"
                class="nav-link nav-search-button"
                aria-label="Search this site"
              >
                <i class="bi bi-search" aria-hidden="true"></i>
                <span class="nav-search-label">Search</span>
                <kbd class="nav-search-kbd" aria-hidden="true">/</kbd>
              </button>
            </li>
            <li class="nav-item">
              <a id="join-button" class="nav-link nav-button-hl" href="/join">Join</a>
            </li>
          </ul>
        </div>
      </dialog>
    </div>
  </nav>
</div>

<dialog aria-modal="true" aria-labelledby="search-label" id="search-dialog">
  <label class="visually-hidden" for="search-input" id="search-label">Search scverse.org</label>
  <div class="search-field">
    <i class="bi bi-search" aria-hidden="true"></i>
    <input
      type="search"
      id="search-input"
      autofocus
      placeholder="Search packages, tutorials, events, blog posts…"
      autocomplete="off"
      spellcheck="false"
      aria-describedby="search-status"
      aria-controls="search-results"
    />
    <button
      type="button"
      class="search-close"
      commandfor="search-dialog"
      command="close-modal"
      aria-label="Close search"
    >
      Esc
    </button>
  </div>
  <p id="search-status" role="status" aria-live="polite"></p>
  <ul id="search-results"></ul>
</dialog>
