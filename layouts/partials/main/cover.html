<div id="cover-heading">
  <div id="title">
    <div id="title-text" class="align-top">
      <h1 id="title-name">{{ .Title }}</h1>
      <span id="title-desc">{{ .Description }}</span>
    </div>
  </div>
  {{ with .Params.hero }}
    <p id="hero-lede">{{ .text | markdownify }}</p>
    <div id="hero-cta">
      <a class="hero-button hero-button-primary" href="/learn">Get started</a>
      <a class="hero-button hero-button-secondary" href="https://github.com/scverse" target="_blank">
        View on GitHub
      </a>
    </div>
    <div id="hero-points">
      {{ range .points }}
        <div class="hero-point">
          <div class="hero-point-icon"><i class="bi {{ .icon }}" aria-hidden="true"></i></div>
          <div class="hero-point-title">{{ .title }}</div>
          <p class="hero-point-text">{{ .text }}</p>
        </div>
      {{ end }}
    </div>
  {{ end }}
</div>
