<!doctype html>
<html lang="en">
  <head>
    {{ partial "head" . }}
    {{ with .OutputFormats.Get "rss" -}}
      {{ printf `<link rel="%s" type="%s" href="%s" title="%s" descr="rol"/>` .Rel .MediaType.Type .Permalink $.Site.Title | safeHTML }}
    {{ end -}}
  </head>
  <body>
    <header>
      {{ partial "header" . }}
    </header>
    <main class="site-main">
      <div class="page-content items-list">
        {{ block "upcoming" . }}
        {{ end }}

        {{ block "main" . }}
        {{ end }}
      </div>
    </main>
    {{ partial "footer" . }}
  </body>
</html>
