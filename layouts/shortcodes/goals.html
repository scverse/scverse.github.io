{{/* Article rather than div so the goal titles stay out of the page's table of contents. */}}
<ul class="goal-list">
  {{ range $i, $goal := .Page.Params.goals }}
    <li>
      <article class="goal">
        <span class="goal-icon" data-hue="{{ mod $i 8 }}" aria-hidden="true">
          <i class="bi {{ $goal.icon }}"></i>
        </span>
        <h3>{{ $goal.name }}</h3>
        <p>{{ $goal.text }}</p>
      </article>
    </li>
  {{ end }}
</ul>
