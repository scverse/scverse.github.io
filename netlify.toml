# Single source of truth for tool versions: .github/actions/setup-hugo reads [build.environment] too, so deploy previews match production.
[build]
# Netlify's Hugo preset stops at `hugo`; the search index is built after it.
# Netlify has no Dart Sass, so fetch it first (Hugo looks for `sass` on the PATH).
command = """
curl -sSfL https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz | tar -xz -C /tmp \
&& export PATH=/tmp/dart-sass:$PATH \
&& hugo --buildFuture --minify && npx --yes pagefind@1.5.2 --site public
"""
publish = "public"

[build.environment]
HUGO_VERSION = "0.164.0"
DART_SASS_VERSION = "1.106.1"

# Old media kit paths (the PNGs used to be dark on light only)
[[redirects]]
from = "/img/logo/scverse.svg"
to = "/img/logo/scverse-logo.svg"
[[redirects]]
from = "/img/logo/scverse.png"
to = "/img/logo/scverse-logo-light.png"
[[redirects]]
from = "/img/logo/scverse-symbol.svg"
to = "/img/logo/scverse-logomark.svg"
[[redirects]]
from = "/img/logo/scverse-symbol.png"
to = "/img/logo/scverse-logomark-light.png"
[[redirects]]
from = "/img/icons/scverse-bw-logo.svg"
to = "/img/logo/scverse-logomark-reg.svg"
[[redirects]]
from = "/img/icons/scverse-blue-logo.svg"
to = "/img/logo/scverse-logomark-blue.svg"
