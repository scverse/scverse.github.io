name: github pages

on:
  push:
    branches:
      - main # Set a branch to deploy
  pull_request:
  workflow_dispatch: # For triggering rebuild on ecosystem update

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # Fetch Hugo themes (true OR recursive)
          fetch-depth: 1 # Fetch all history for .GitInfo and .Lastmod

      - name: Use Netlify’s build environment (tool versions), so previews match production
        shell: python
        run: |
          import os, tomllib
          with open("netlify.toml", "rb") as f:
              env = tomllib.load(f)["build"]["environment"]
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.writelines(f"{k}={v}\n" for k, v in env.items())

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Dart Sass
        run: |
          curl -sSfL "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"

      - name: Build
        run: hugo --buildFuture --minify

      - name: Build search index
        run: npx --yes pagefind@1.5.2 --site public

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

      - name: Upload page build as artifact
        uses: actions/upload-artifact@v7
        if: github.ref != 'refs/heads/main'
        with:
          name: scverse.github.io
          path: ./public
