name: Setup Hugo
description: Install Hugo with the version from Netlify’s build environment, which is also exported to later steps

runs:
  using: composite
  steps:
    - name: Use Netlify’s build environment (tool versions), so previews match production
      shell: python
      run: |
        import os, tomllib
        with open("netlify.toml", "rb") as f:
            env = tomllib.load(f)["build"]["environment"]
        with open(os.environ["GITHUB_ENV"], "a") as f:
            f.writelines(f"{k}={v}\n" for k, v in env.items())
    - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
      with:
        hugo-version: ${{ env.HUGO_VERSION }}
        extended: true
